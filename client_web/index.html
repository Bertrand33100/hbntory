
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBntory - Assistant intelligent</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <header>
        <h1>HBntory</h1>
        <p>Votre assistant intelligent pour les produits et les stocks</p>
    </header>

    <main>

        <section>
            <h2>Posez votre question</h2>

            <form id="question-form">

                <input
                    type="text"
                    id="question"
                    name="question"
                    placeholder="Exemple : Quel est le stock du produit 34 à Lyon ?"
                    required
                >

                <button type="submit">Envoyer</button>

            </form>
        </section>

        <section>
            <h2>Réponse de l'assistant</h2>

            <div id="response">
                La réponse apparaîtra ici.
            </div>
        </section>

    </main>

</body>
</html>
